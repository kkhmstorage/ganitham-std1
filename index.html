/* VOICE: playful, warm, encouraging — a picture-book world for 6-year-olds
   IDEA: a sunny Kerala village map; each chapter is a stop on Thithiri's journey
   PICTURE: big tappable sprites, the mascot bird Thithiri who talks and reacts
   COLOUR and TYPE: sky blue + leaf green ground, one bright colour per chapter; Noto Sans Malayalam (embedded) + Nunito
   LAYOUT: map -> chapter -> game stage with progress dots; huge 64px+ targets */
:root{color-scheme:light;--ink:#2b2340;--sky1:#9fdcff;--sky2:#fff4cf;--card:#fff;--c:#ff7b3a}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:linear-gradient(#9fdcff 0%,#cdeeff 45%,#fff4cf 100%);color:var(--ink);font:18px/1.5 "Nunito","KG Mal","Noto Sans Malayalam",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:4px solid #5a3fd6;outline-offset:3px}
.hills{position:fixed;inset:auto 0 0 0;height:30vh;z-index:0;pointer-events:none}
.sun{position:fixed;top:-40px;right:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(#fff6a8,#ffd23f 60%,#ffb703);box-shadow:0 0 80px #ffe066;z-index:0;animation:spin 40s linear infinite}
.cloud{position:fixed;z-index:0;background:#fff;border-radius:60px;opacity:.85;height:40px;animation:drift 60s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:50px;height:50px;top:-24px;left:18px}.cloud::after{width:36px;height:36px;top:-16px;left:56px}
#app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:10px max(3vw,12px) 140px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top h1{flex:1;margin:0;font-size:clamp(22px,4vw,32px);line-height:1.1;font-weight:800;color:#3b2a8a;text-shadow:0 2px 0 #fff}
.pill{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;box-shadow:0 4px 0 #0001}
.ibtn{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 0 #0002;flex:none}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 #0002}
.ibtn svg{width:28px;height:28px}
/* map */
.hero{text-align:center;margin:6px 0 18px}
.hero h2{margin:0;font-size:clamp(34px,7vw,52px);line-height:1.05;color:#3b2a8a;text-shadow:0 3px 0 #fff}
.hero p{margin:4px 0 0;font-size:18px}
.map{position:relative;display:grid;gap:18px}
.isle{position:relative;display:flex;align-items:center;gap:16px;background:#fff;border-radius:32px;padding:14px 20px 14px 14px;box-shadow:0 8px 0 var(--c),0 12px 24px #0002;text-align:left;width:min(560px,100%);animation:pop .5s both;transition:transform .15s}
.isle:nth-child(odd){justify-self:start}.isle:nth-child(even){justify-self:end}
.isle:hover{transform:translateY(-3px) rotate(-1deg)}
.isle:active{transform:translateY(4px);box-shadow:0 3px 0 var(--c)}
.isle .num{flex:none;width:76px;height:76px;border-radius:24px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:44px;font-weight:800;box-shadow:inset 0 -6px 0 #0002}
.isle h3{margin:0;font-size:clamp(22px,4vw,28px);line-height:1.1}
.isle small{display:block;font-size:16px;opacity:.75}
.isle .st{margin-top:2px;font-weight:800;color:#e09a00}
.isle .emo{margin-left:auto;font-size:44px;animation:bob 2.4s ease-in-out infinite}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.big{background:#5a3fd6;color:#fff;border-radius:22px;padding:12px 24px;font-size:22px;font-weight:800;box-shadow:0 6px 0 #3b2a8a;min-height:60px}
.big.alt{background:#fff;color:#3b2a8a;box-shadow:0 6px 0 #c9bff5}
.big.go{background:#2fb35b;box-shadow:0 6px 0 #1d7a3c}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #3b2a8a}
details.teach{background:#fffd;border-radius:20px;padding:12px 18px;margin-top:22px;font-size:16px}
details.teach summary{font-weight:800;cursor:pointer;font-size:18px}
details.teach li{margin:4px 0}
/* chapter */
.banner{background:var(--c);color:#fff;border-radius:28px;padding:18px 22px;display:flex;align-items:center;gap:14px;box-shadow:inset 0 -8px 0 #0002;margin-bottom:16px}
.banner h2{margin:0;font-size:clamp(28px,5vw,40px);line-height:1.05}
.banner p{margin:0;font-size:17px;opacity:.95}
.banner .emo{font-size:56px;margin-left:auto}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px}
.gcard{background:#fff;border-radius:28px;padding:18px;text-align:center;box-shadow:0 8px 0 var(--c),0 10px 20px #0002;animation:pop .45s both}
.gcard:active{transform:translateY(4px);box-shadow:0 3px 0 var(--c)}
.gcard .emo{font-size:64px;line-height:1.1;display:block;animation:bob 2.4s ease-in-out infinite}
.gcard h3{margin:6px 0 0;font-size:24px;line-height:1.15}
.gcard p{margin:4px 0 6px;font-size:16px;opacity:.8}
.stars{font-size:26px;letter-spacing:2px}
.stars .off{filter:grayscale(1);opacity:.3}
.nextup{display:inline-block;background:#ffe066;border-radius:999px;padding:0 10px;font-size:14px;font-weight:800;margin-top:4px;animation:pulse 1.2s infinite}
/* play */
.playhead{display:flex;align-items:center;gap:10px;background:#fff;border-radius:22px;padding:8px 14px;box-shadow:0 5px 0 var(--c);margin-bottom:12px}
.playhead h2{margin:0;flex:1;font-size:clamp(20px,3.6vw,26px);line-height:1.1}
.dots{display:flex;gap:6px}
.dots i{width:18px;height:18px;border-radius:50%;background:#eee;box-shadow:inset 0 2px 0 #0001;transition:.3s}
.dots i.done{background:var(--c);transform:scale(1.15)}
.dots i.now{outline:3px solid var(--c);outline-offset:2px}
.stage{background:#fffe;border-radius:32px;padding:clamp(14px,3vw,26px);min-height:380px;box-shadow:0 10px 30px #0002;text-align:center;animation:pop .35s both}
.q{font-size:clamp(22px,4.4vw,30px);font-weight:800;margin:6px 0 12px;line-height:1.25}
.q svg{vertical-align:middle}
.hint{font-size:18px;margin:8px 0 0;opacity:.85}
.eq{font-size:clamp(34px,7vw,52px);font-weight:800;letter-spacing:2px;color:#3b2a8a;margin:6px 0}
.opts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.opt{min-width:92px;height:92px;padding:0 14px;border-radius:26px;background:#fff;font-size:52px;font-weight:800;box-shadow:0 7px 0 var(--c),0 0 0 3px var(--c) inset;display:grid;place-items:center;animation:pop .4s both}
.opt:nth-child(2){animation-delay:.08s}.opt:nth-child(3){animation-delay:.16s}.opt:nth-child(4){animation-delay:.24s}
.opt:active{transform:translateY(5px);box-shadow:0 2px 0 var(--c),0 0 0 3px var(--c) inset}
.opt.right{background:#c8f7d4;box-shadow:0 7px 0 #2fb35b,0 0 0 3px #2fb35b inset;animation:yay .6s}
.wob{animation:wob .5s !important}
.scene{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px;min-height:120px}
.grp{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:360px;padding:10px;border-radius:24px}
.item{position:relative;font-size:clamp(40px,8vw,58px);line-height:1;display:inline-block;animation:pop .4s both;user-select:none;cursor:pointer}
.item[data-c]::after{content:attr(data-c);position:absolute;top:-6px;right:-6px;background:#5a3fd6;color:#fff;font-size:18px;font-weight:800;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:"Nunito",sans-serif;animation:pop .3s}
.mom{font-size:clamp(70px,14vw,110px);line-height:1;animation:bob 2s ease-in-out infinite}
.trail{display:flex;justify-content:center;gap:4px;align-items:center;margin-bottom:6px;font-size:26px}
.trail span{width:40px;height:40px;border-radius:50%;background:#e9f7ec;display:grid;place-items:center}
.trail span.here{background:#ffe066;animation:pulse 1s infinite}
.tap-tip{font-size:15px;opacity:.7;margin:2px 0 0}
/* shapes */
.field{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:8px}
.shapebtn{padding:6px;border-radius:20px;animation:pop .4s both;animation-delay:var(--d)}
.shapebtn svg{display:block;filter:drop-shadow(0 4px 0 #0002)}
.shapebtn.got{animation:gone .45s forwards}
.patrow{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;background:#f4f0ff;border-radius:22px;padding:12px}
.qbox{width:70px;height:70px;border:4px dashed #5a3fd6;border-radius:16px;display:grid;place-items:center;font-size:40px;font-weight:800;color:#5a3fd6;animation:pulse 1.2s infinite}
.dotsvg{width:min(86vw,380px);height:auto;display:block;margin:0 auto;touch-action:manipulation}
.dotsvg .d{fill:#5a3fd6}
.dotsvg .d.nx{fill:#ff4d6d;animation:glow 0.9s infinite;transform-box:fill-box;transform-origin:center}
.dotsvg .d.ok{fill:#2fb35b}
.dotsvg line{stroke:#3b2a8a;stroke-width:3;stroke-linecap:round}
.dotsvg .fill{opacity:0;transition:opacity .8s}
.dotsvg .fill.on{opacity:1}
.reveal{font-size:30px;font-weight:800;min-height:46px;color:#3b2a8a}
/* basket & tree */
.tree{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;background:radial-gradient(ellipse at 50% 60%,#7bd389,#3fae5a);border-radius:50% 50% 40% 40%;padding:24px 30px;max-width:420px;margin:0 auto;box-shadow:inset 0 -10px 0 #0002}
.basket{margin:14px auto 0;max-width:420px;min-height:100px;border-radius:12px 12px 60px 60px;background:repeating-linear-gradient(90deg,#c98b4a 0 14px,#b0753a 14px 28px);display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:4px;padding:12px;box-shadow:inset 0 8px 0 #0002}
.basket:empty::before{content:"കൊട്ട";color:#fff;font-weight:800;font-size:22px;opacity:.8}
.target{display:inline-grid;place-items:center;width:92px;height:92px;border-radius:26px;background:var(--c);color:#fff;font-size:60px;font-weight:800;box-shadow:inset 0 -7px 0 #0002;vertical-align:middle}
.word{display:block;font-size:22px;font-weight:700;color:#3b2a8a}
.choice{flex:1 1 220px;max-width:340px;background:#fff;border-radius:28px;box-shadow:0 7px 0 var(--c),0 0 0 3px var(--c) inset;padding:14px;min-height:160px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:6px}
.choice:active{transform:translateY(4px)}
.choice.right{background:#c8f7d4}
/* bag */
.bagscene{display:flex;align-items:flex-end;justify-content:center;gap:20px;flex-wrap:wrap}
.animals{font-size:46px;display:flex;gap:8px}
.bag{position:relative;width:230px;min-height:150px;background:linear-gradient(#e76f51,#c0533a);border-radius:20px 20px 70px 70px;padding:28px 12px 18px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px;box-shadow:inset 0 -10px 0 #0002}
.bag::before{content:"";position:absolute;top:-26px;left:50%;width:90px;height:50px;margin-left:-45px;border:9px solid #c0533a;border-bottom:0;border-radius:50px 50px 0 0}
.bag .item{font-size:40px}
.fly{animation:fly .7s forwards}
.flyin{animation:flyin .9s both}
.flyaway{animation:flyaway 1s forwards}
.branch{position:relative;max-width:520px;margin:20px auto 0;padding:0 10px 18px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;min-height:90px}
.branch::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:16px;border-radius:10px;background:linear-gradient(#8d5a2b,#6b4220);z-index:-1}
/* phone */
.phone{width:min(300px,86vw);margin:0 auto;background:#2b2340;border-radius:36px;padding:16px 16px 20px;box-shadow:0 10px 0 #0003}
.screen{background:linear-gradient(#cfe8ff,#eaf4ff);border-radius:20px;min-height:92px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;padding:10px;margin-bottom:12px}
.stick{display:inline-block;width:12px;height:56px;border-radius:6px;background:#e63946;box-shadow:inset -3px 0 0 #0002;font-size:0}
.stick[data-c]::after{top:-12px;right:-14px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:64px;border-radius:18px;background:#4a3f6b;color:#fff;font-size:34px;font-weight:800;box-shadow:0 5px 0 #18122b}
.key:active,.key.lit{background:#ff4d6d;transform:translateY(3px);box-shadow:0 2px 0 #18122b}
.key.lit{background:#2fb35b}
.key.blank{visibility:hidden}
/* balloons */
.sky{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(8px,2vw,18px);padding:10px 0 30px;min-height:260px}
.ball{position:relative;width:78px;height:94px;border-radius:50% 50% 48% 48%;color:#fff;font-size:34px;font-weight:800;display:grid;place-items:center;box-shadow:inset -8px -10px 0 #0002,inset 8px 8px 0 #fff4;animation:bob 2.6s ease-in-out infinite;animation-delay:var(--d)}
.ball::after{content:"";position:absolute;bottom:-26px;left:50%;width:2px;height:26px;background:#0004}
.ball.popd{animation:burst .35s forwards}
/* ten frame */
.frame{display:inline-grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#5a3fd6;padding:8px;border-radius:18px}
.frame b{width:clamp(44px,9vw,60px);height:clamp(44px,9vw,60px);background:#fff;border-radius:12px;display:grid;place-items:center;font-size:clamp(30px,6vw,42px);font-weight:400}
.cake{margin:10px auto 0;max-width:460px}
.cake .ctop{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;min-height:60px;align-items:flex-end;margin:0}
.cake .base{height:70px;border-radius:16px;background:repeating-linear-gradient(90deg,#ff8fab 0 30px,#ffb3c6 30px 60px);box-shadow:inset 0 10px 0 #fff8,inset 0 -8px 0 #0002}
.candle{font-size:34px;line-height:1}
.candle.lit10{filter:hue-rotate(0)}
.ctrl{display:flex;justify-content:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.ctrl .big{min-width:84px}
.kids{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.kid{background:#fff8e1;border-radius:24px;padding:10px 14px;min-width:150px}
.kid h4{margin:0;font-size:20px}
.tray{display:inline-grid;grid-template-columns:repeat(5,1fr);gap:6px;background:#c9a27e;padding:10px;border-radius:20px;box-shadow:inset 0 -6px 0 #0002}
.tray b{width:clamp(44px,9vw,58px);height:clamp(44px,9vw,58px);border-radius:50%;background:#a07a56;box-shadow:inset 0 4px 0 #0003;display:grid;place-items:center;font-size:clamp(28px,6vw,40px);font-weight:400}
.loose{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px;min-height:60px}
.loose .item{font-size:clamp(36px,7vw,50px)}
/* finish */
.finish{text-align:center}
.finish h2{font-size:clamp(36px,7vw,54px);margin:0;line-height:1.05;color:#3b2a8a}
.bigstars{font-size:clamp(56px,12vw,84px);margin:8px 0}
.bigstars span{display:inline-block;animation:starIn .6s both}
.bigstars .off{filter:grayscale(1);opacity:.25}
.bigstars span:nth-child(2){animation-delay:.35s}.bigstars span:nth-child(3){animation-delay:.7s}
.sticker{display:inline-block;margin-top:14px;font-size:90px;animation:spinIn 1s 1s both;background:#fff;border-radius:50%;width:140px;height:140px;line-height:140px;box-shadow:0 0 0 8px #ffe066,0 10px 20px #0002}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px}
.slot{background:#fff;border-radius:24px;aspect-ratio:1;display:grid;place-items:center;font-size:56px;box-shadow:0 6px 0 #0001;text-align:center;line-height:1.1}
.slot small{display:block;font-size:13px;line-height:1.2}
.slot.locked{background:#ffffff88;color:#0004;font-size:44px}
/* mascot */
#mascot{position:fixed;left:max(10px,calc(50% - 480px));bottom:10px;z-index:5;display:flex;align-items:flex-end;gap:6px;pointer-events:none;max-width:calc(100% - 20px)}
#mascot svg{width:100px;height:116px;flex:none;pointer-events:auto;cursor:pointer}
#mascot.happy svg{animation:hop .6s 2}
#mascot .armR{transform-box:view-box;transform-origin:82px 96px}#mascot.happy .armR{animation:wave .5s 3}
#mascot .mouth{transform-box:fill-box;transform-origin:center}#mascot.talk .mouth{animation:talk .22s infinite alternate;fill:#7a2b22;fill-opacity:1}
@keyframes wave{50%{transform:rotate(-70deg)}}@keyframes talk{to{transform:scaleY(1.9)}}
#mascot.think svg{animation:tilt .8s}
#bubble{background:#fff;border-radius:22px 22px 22px 4px;padding:10px 16px;font-size:20px;font-weight:700;box-shadow:0 6px 16px #0002;margin-bottom:62px;max-width:420px;animation:pop .3s}
#bubble:empty{display:none}
.eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
.cf{position:fixed;width:12px;height:16px;border-radius:3px;z-index:9;pointer-events:none;animation:cf 1.1s ease-out forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}to{transform:scale(1);opacity:1}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes wob{20%{transform:translateX(-10px) rotate(-4deg)}40%{transform:translateX(10px) rotate(4deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes yay{40%{transform:scale(1.2) rotate(-4deg)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes glow{50%{transform:scale(1.6)}}
@keyframes gone{40%{transform:scale(1.3)}to{transform:scale(0) rotate(180deg);opacity:0}}
@keyframes fly{to{transform:translate(-160px,-140px) scale(.5) rotate(-40deg);opacity:0}}
@keyframes flyin{from{transform:translate(320px,-160px) scale(.6)}70%{transform:translate(0,-10px)}to{transform:none}}
@keyframes flyaway{to{transform:translate(260px,-260px) scale(.5);opacity:0}}
@keyframes burst{50%{transform:scale(1.4)}to{transform:scale(0);opacity:0}}
@keyframes starIn{from{transform:scale(0) rotate(-180deg)}70%{transform:scale(1.3)}to{transform:none}}
@keyframes spinIn{from{transform:scale(0) rotate(-360deg)}to{transform:none}}
@keyframes hop{50%{transform:translateY(-22px)}}
@keyframes tilt{30%{transform:rotate(-12deg)}70%{transform:rotate(8deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(600deg);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(110vw)}}
@media(max-width:600px){.playhead{gap:6px;padding:6px 8px}.playhead h2{font-size:17px}.playhead .ibtn{width:44px;height:44px}.dots{gap:4px}.dots i{width:12px;height:12px}#mascot svg{width:76px;height:88px}#bubble{font-size:17px;margin-bottom:44px}.opt{min-width:80px;height:80px;font-size:44px}.isle .emo{display:none}.isle .num{width:62px;height:62px;font-size:36px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important}}
</style>
</head>
<body>
<div class="sun"></div>
<div class="cloud" style="top:70px;width:110px;animation-delay:-10s"></div>
<div class="cloud" style="top:170px;width:90px;animation-delay:-38s;animation-duration:80s"></div>
<svg class="hills" viewBox="0 0 1200 300" preserveAspectRatio="none"><path d="M0 170 Q200 70 420 160 T820 140 T1200 120 V300 H0Z" fill="#9be38f"/><path d="M0 230 Q260 150 520 220 T1000 200 T1200 190 V300 H0Z" fill="#5cc46a"/><path d="M0 280 Q300 240 600 270 T1200 260 V300 H0Z" fill="#3fae5a"/></svg>

<div id="app">
  <div class="top">
    <button class="ibtn" id="homeBtn" aria-label="മാപ്പ്"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z" fill="#5a3fd6"/></svg></button>
    <h1>കുഞ്ഞുഗണിതം</h1>
    <span class="pill" id="starPill">⭐ 0</span>
    <button class="ibtn" id="sndBtn" aria-label="ശബ്ദം"></button>
  </div>

</div>

<div id="mascot">

  <!-- legs -->
  <rect x="47" y="124" width="10" height="10" rx="4" fill="#2b3a67"/><rect x="63" y="124" width="10" height="10" rx="4" fill="#2b3a67"/>

  <g class="armL"><path d="M38 96 Q24 104 24 118" stroke="#1d1d22" stroke-width="11" stroke-linecap="round" fill="none"/><circle cx="24" cy="120" r="5.5" fill="#c98d63"/></g>

  <!-- t-shirt -->
  <path d="M36 98 Q38 88 50 86 L70 86 Q82 88 84 98 L86 128 Q60 133 34 128Z" fill="#e63946"/>
  <path d="M36 98 Q38 88 50 86 L54 86 Q44 92 40 104Z M84 98 Q82 88 70 86 L66 86 Q76 92 80 104Z" fill="#1d1d22"/>

  <g fill="#1c1517">
    <path d="M27 50 Q22 26 40 15 Q58 4 78 9 Q98 16 96 40 Q95 48 92 54 Q88 40 78 36 Q60 30 42 36 Q32 40 27 50Z"/>
    <path d="M30 22 Q30 8 46 8 Q40 12 40 18Z M48 8 Q58 -2 72 4 Q62 5 58 12Z M70 6 Q88 4 92 18 Q84 12 78 14Z M88 16 Q102 24 98 40 Q94 28 88 26Z M24 36 Q20 24 30 18 Q28 28 32 32Z"/>
    <path d="M29 46 Q60 34 93 46 L93 34 L29 34Z"/>
    <path d="M28 54 Q30 34 52 31 Q43 38 42 50 Q37 46 28 54Z"/>
    <path d="M40 49 Q48 30 70 30 Q59 36 57 48 Q51 43 40 49Z"/>
    <path d="M55 46 Q66 29 86 33 Q76 39 76 50 Q69 43 55 46Z"/>
    <path d="M73 45 Q86 35 95 44 Q95 51 93 57 Q86 47 73 45Z"/>
  </g>
  <path d="M36 24 Q46 14 58 15 M64 12 Q76 10 86 18 M46 30 Q56 23 68 23 M74 24 Q84 25 90 32" stroke="#4d3d44" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- brows -->
  <path d="M41 55 Q47 52 53 55 M67 55 Q73 52 79 55" stroke="#1c1517" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <!-- eyes -->
  <ellipse cx="47" cy="63" rx="6" ry="6.6" fill="#fff"/><ellipse cx="73" cy="63" rx="6" ry="6.6" fill="#fff"/>

  <path d="M58 70 Q60 73 62.5 70" stroke="#9c6040" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <ellipse cx="40" cy="73" rx="4.5" ry="3" fill="#ff8f8f" opacity=".45"/><ellipse cx="80" cy="73" rx="4.5" ry="3" fill="#ff8f8f" opacity=".45"/>

<script>
{
const $=s=>document.querySelector(s);
/* ---------- number words (correct Malayalam forms) ---------- */
const W=['പൂജ്യം','ഒന്ന്','രണ്ട്','മൂന്ന്','നാല്','അഞ്ച്','ആറ്','ഏഴ്','എട്ട്','ഒൻപത്','പത്ത്','പതിനൊന്ന്','പന്ത്രണ്ട്','പതിമൂന്ന്','പതിനാല്','പതിനഞ്ച്','പതിനാറ്','പതിനേഴ്','പതിനെട്ട്','പത്തൊൻപത്','ഇരുപത്'];
const UM=['പൂജ്യവും','ഒന്നും','രണ്ടും','മൂന്നും','നാലും','അഞ്ചും','ആറും','ഏഴും','എട്ടും','ഒൻപതും','പത്തും'];
const IL=['','ഒന്നിൽ','രണ്ടിൽ','മൂന്നിൽ','നാലിൽ','അഞ്ചിൽ','ആറിൽ','ഏഴിൽ','എട്ടിൽ','ഒൻപതിൽ'];
const ENN=['ഒന്നുമില്ല','ഒരെണ്ണം','രണ്ടെണ്ണം','മൂന്നെണ്ണം','നാലെണ്ണം','അഞ്ചെണ്ണം','ആറെണ്ണം','ഏഴെണ്ണം','എട്ടെണ്ണം','ഒൻപതെണ്ണം','പത്തെണ്ണം'];
const ADJ=n=>n===1?'ഒരു':W[n];
const birds=n=>n===1?'ഒരു കിളി':W[n]+' കിളികൾ';
const N=n=>({t:String(n),s:W[n]});
const PRAISE=['അടിപൊളി!','സൂപ്പർ!','കൊള്ളാം!','നല്ല മിടുക്ക്!','ശരിയാണ്!','ഹായ്, കലക്കി!'];
const TRY=['സാരമില്ല, ഒന്നുകൂടി നോക്കൂ.','വീണ്ടും ശ്രമിക്കാം.','ഒന്ന് എണ്ണി നോക്കൂ.','ഏതാണ്ട് ശരിയായി! ഒന്നുകൂടി നോക്കൂ.'];
const COLORS=['#ff595e','#ffb703','#1982c4','#8ac926','#6a4c93','#ff7b3a','#e85d9b','#1f9d9a'];
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rep=(s,n)=>Array.from({length:n},(_,i)=>typeof s==='function'?s(i):s);

let store={};
try{store=JSON.parse(localStorage.getItem('kunju-ganitham')||'{}')}catch(e){}
store.stars=store.stars||{};if(store.sound===undefined)store.sound=true;
const save=()=>{try{localStorage.setItem('kunju-ganitham',JSON.stringify(store))}catch(e){}};

/* ---------- sound effects ---------- */
let ac=null;
function actx(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}return ac}
function tone(f,d,type,when,vol){if(!store.sound)return;const a=actx();if(!a)return;try{const t=a.currentTime+(when||0),o=a.createOscillator(),g=a.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.14,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const sfx={ok(){tone(660,.18);tone(990,.3,'triangle',.12)},bad(){tone(240,.22,'sine',0,.1);tone(200,.25,'sine',.15,.08)},pop(){tone(900,.09,'square',0,.04)},tap(){tone(560,.08,'triangle',0,.08)},
 win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.32,'triangle',i*.12))},whoosh(){tone(400,.3,'sine',0,.05);tone(700,.25,'sine',.1,.04)}};

/* ---------- voice: pre-recorded clips in audio/<hash>.mp3 ---------- */
const hash=s=>{let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0')};
const clipCache={};let voiceGen=0,playing=[];
let voicePack=null;const getPack=()=>voicePack||(voicePack=fetch('voice.json').then(r=>r.json()).catch(()=>({})));
function loadClip(s){const k=hash(s.trim());if(!clipCache[k])clipCache[k]=getPack().then(p=>{if(!p[k])throw 0;const bin=atob(p[k]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}).then(b=>new Promise((ok,no)=>actx().decodeAudioData(b,ok,no))).catch(()=>{window.__missing=(window.__missing||[]);window.__missing.push(s.trim());return null});return clipCache[k]}
async function speakParts(list){const gen=++voiceGen;playing.forEach(n=>{try{n.stop()}catch(e){}});playing=[];if(!store.sound||!list.length)return;const a=actx();if(!a)return;
 const bufs=await Promise.all(list.map(loadClip));if(gen!==voiceGen)return;let t=a.currentTime+.05;
 const m=$('#mascot');m.classList.add('talk');clearTimeout(window.__tk);
 for(const b of bufs){if(!b)continue;const src=a.createBufferSource();src.buffer=b;src.connect(a.destination);src.start(t);playing.push(src);t+=b.duration+.07}
 window.__tk=setTimeout(()=>m.classList.remove('talk'),(t-a.currentTime)*1000)}
const speakWord=w=>speakParts([w]);

/* ---------- mascot ---------- */
let lastParts=[];
const ptxt=p=>typeof p==='string'?p:p.t;const pspk=p=>typeof p==='string'?p:p.s;
function say(parts,mood){if(!Array.isArray(parts))parts=[parts];lastParts=parts;
 const txt=parts.map(ptxt).filter(Boolean).join(' ').replace(/\s+([.,!?])/g,'$1');
 const b=$('#bubble');b.textContent=txt;b.style.animation='none';void b.offsetWidth;b.style.animation='';
 const m=$('#mascot');m.classList.remove('happy','think');void m.offsetWidth;if(mood)m.classList.add(mood);
 speakParts(parts.map(pspk).filter(Boolean))}
const replay=()=>{actx();say(lastParts.length?lastParts:['വാ, നമുക്ക് കളിക്കാം!'],'happy')};
$('#bird').onclick=replay;$('#bubble').onclick=replay;
function drawSnd(){$('#sndBtn').innerHTML=store.sound?'<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#5a3fd6"/><path d="M16 8q3 4 0 8M18.5 5.5q5 6.5 0 13" stroke="#5a3fd6" stroke-width="2" fill="none" stroke-linecap="round"/></svg>':'<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#999"/><path d="M16 9l6 6M22 9l-6 6" stroke="#999" stroke-width="2" stroke-linecap="round"/></svg>'}

function confetti(x,y,n){n=n||22;for(let i=0;i<n;i++){const s=document.createElement('span');s.className='cf';s.style.left=x+'px';s.style.top=y+'px';s.style.background=pick(COLORS);const a=Math.random()*Math.PI*2,d=R(80,220);s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',(Math.sin(a)*d-60)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}}

/* ---------- shapes ---------- */
const SH={
 circle:{n:'വട്ടം',is:'അത് വട്ടമാണ്.',svg:c=>`<circle cx="50" cy="50" r="40" fill="${c}"/>`},
 square:{n:'ചതുരം',is:'അത് ചതുരമാണ്.',svg:c=>`<rect x="12" y="12" width="76" height="76" rx="6" fill="${c}"/>`},

 $('#screen').innerHTML=`<div class="playhead"><button class="ibtn" id="back" aria-label="തിരികെ"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" stroke="#5a3fd6" stroke-width="3" fill="none" stroke-linecap="round"/></svg></button><h2>${G[id].emo} ${G[id].name}</h2><button class="ibtn" id="again" aria-label="ചോദ്യം വീണ്ടും കേൾക്കാം"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#5a3fd6"/><path d="M16 8q3 4 0 8" stroke="#5a3fd6" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button><div class="dots" id="pdots"></div></div><div class="stage" id="stage"></div>`;
 $('#back').onclick=()=>showChapter(ci);$('#again').onclick=replay;say(G[id].intro,'happy');later(nextRound,3200);dotsDraw()}

 cur=null;say(s===3?['ഹായ്! മൂന്ന് നക്ഷത്രം!','നീയൊരു ഗണിതതാരം തന്നെ!']:['കൊള്ളാം!','ഇനിയും കളിച്ചാൽ കൂടുതൽ നക്ഷത്രം കിട്ടും.'],'happy');
